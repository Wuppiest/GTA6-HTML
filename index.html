<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Vice Legacy 3D – Solara Bay</title>
<style>
:root{--pink:#ff2d95;--cyan:#22e4ff;--amber:#ffb03a;--green:#5fd35f;--blue:#4aa3ff;--purple:#8b5cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05030c;color:#fff;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
#gameRoot{position:fixed;inset:0;transition:filter .8s}
#gameRoot.gray{filter:grayscale(1) contrast(1.15) brightness(.85)}
#gameRoot canvas{display:block;width:100%;height:100%;outline:none}
.hidden{display:none!important}
.tf{font-family:Impact,"Arial Black","Haettenschweiler",sans-serif;letter-spacing:.04em}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#compass{position:absolute;top:8px;left:50%;transform:translateX(-50%)}
#envBox{position:absolute;top:40px;left:50%;transform:translateX(-50%);font-size:12px;background:rgba(0,0,0,.4);padding:3px 12px;border-radius:10px;text-shadow:0 1px 2px #000;white-space:nowrap}
#topRight{position:absolute;top:12px;right:18px;text-align:right}
#stars{font-size:30px;letter-spacing:3px;color:rgba(255,255,255,.16);text-shadow:0 2px 3px rgba(0,0,0,.8);height:36px}
#stars .on{color:#fff}
#stars.flash .on{animation:starFlash .45s infinite}
@keyframes starFlash{50%{color:rgba(255,255,255,.22)}}
#money{font-size:32px;color:#9cff9c;text-shadow:0 2px 3px #000,0 0 12px rgba(60,255,60,.35)}
#weaponBox{margin-top:2px;font-size:15px;text-shadow:0 1px 2px #000}
#weaponName{font-weight:700;color:var(--amber);margin-right:8px;text-transform:uppercase}
#ammo{font-size:21px;font-weight:800}
#reloadTag{color:var(--pink);font-weight:700;margin-left:6px}
#charBox{margin-top:8px;display:flex;gap:6px;justify-content:flex-end}
.charChip{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;background:rgba(0,0,0,.5);border:2px solid transparent;opacity:.55}
.charChip.active{opacity:1;border-color:#fff}
#topLeft{position:absolute;top:12px;left:18px;max-width:360px}
#helpBox{background:rgba(0,0,0,.75);border-left:4px solid var(--pink);padding:10px 13px;font-size:14px;line-height:1.45;border-radius:3px;opacity:0;transition:opacity .3s}
#helpBox.show{opacity:1}
#helpBox kbd,.menuBox kbd{display:inline-block;background:#fff;color:#111;border-radius:3px;padding:0 5px;font-size:12px;font-weight:700;margin:0 1px;font-family:inherit}
#notify{position:absolute;top:110px;left:18px;display:flex;flex-direction:column;gap:6px;max-width:330px}
.note{background:rgba(12,6,28,.8);border-left:4px solid var(--cyan);padding:7px 11px;font-size:13px;animation:noteIn .25s ease-out;border-radius:3px;transition:opacity .5s}
@keyframes noteIn{from{transform:translateX(-30px);opacity:0}}
#radarWrap{position:absolute;left:18px;bottom:18px;width:210px}
#minimap{border-radius:50%;border:3px solid rgba(0,0,0,.65);box-shadow:0 0 0 2px rgba(255,255,255,.18),0 4px 14px rgba(0,0,0,.6);display:block;width:210px;height:210px}
#bars{display:flex;gap:4px;margin-top:6px}
.bar{flex:1;height:8px;background:rgba(0,0,0,.6);border-radius:2px;overflow:hidden}
.bar>div{height:100%;width:100%;transition:width .2s}
#hpFill{background:linear-gradient(90deg,#3c9b3c,#6be36b)}
#armorFill{background:linear-gradient(90deg,#2f6fc7,#6ab4ff)}
#speedo{position:absolute;right:22px;bottom:22px;text-align:right;text-shadow:0 2px 4px #000;min-width:180px}
#vehName{font-size:13px;color:var(--cyan);text-transform:uppercase;letter-spacing:.12em}
#speedVal{font-size:58px;line-height:1;font-weight:800;font-style:italic}
#speedo .unit{font-size:12px;opacity:.7;margin-bottom:6px}
#vehHp{background:linear-gradient(90deg,#c74a2f,#ffb03a)}
#nitroFill{background:linear-gradient(90deg,#ff2d95,#22e4ff)}
#speedo .bar{margin-top:4px}
#radioName{font-size:12px;margin-top:6px;color:var(--pink);font-weight:700}
#objective{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);font-size:19px;text-align:center;text-shadow:0 2px 3px #000,0 0 3px #000;max-width:62vw;line-height:1.35}
#objective b{color:var(--amber)}
#objective i{color:var(--cyan);font-style:normal}
#timerBox{position:absolute;top:120px;right:18px;font-size:28px;font-weight:800;text-shadow:0 2px 3px #000;color:#fff}
#timerBox.low{color:#ff4b4b}
#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;transition:transform .1s}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#crosshair:before{left:10px;top:2px;width:2px;height:18px}
#crosshair:after{top:10px;left:2px;height:2px;width:18px}
#crosshair.target:before,#crosshair.target:after{background:#ff3b3b}
#crosshair.small{transform:scale(.45);opacity:.75}
#hitmarker{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;transition:opacity .15s}
#hitmarker:before,#hitmarker:after{content:"";position:absolute;left:12px;top:0;width:2px;height:26px;background:#ff5050}
#hitmarker:before{transform:rotate(45deg)}#hitmarker:after{transform:rotate(-45deg)}
#waypointInd{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:12px;font-weight:700;text-shadow:0 1px 2px #000;white-space:nowrap}
#waypointInd .dia{width:13px;height:13px;background:var(--amber);transform:rotate(45deg);margin:0 auto 4px;box-shadow:0 0 8px var(--amber)}
#vignette{position:absolute;inset:0;box-shadow:inset 0 0 170px 50px rgba(255,0,0,.8);opacity:0;transition:opacity .2s}
#policeEdge{position:absolute;inset:0;opacity:0;transition:opacity .4s}
#lockHint{position:absolute;bottom:250px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:6px 14px;border-radius:12px;font-size:13px}
#muteBtn{position:absolute;right:18px;bottom:150px;pointer-events:auto;background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
#bigText{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:8;pointer-events:none;opacity:0;transition:opacity .6s}
#bigText.show{opacity:1}
#bigText h1{font-size:min(120px,16vw);font-family:Impact,"Arial Black",sans-serif;letter-spacing:.06em;text-shadow:0 4px 0 #000,0 0 30px rgba(0,0,0,.8)}
#bigText p{font-size:22px;margin-top:6px;text-shadow:0 2px 3px #000}
#bigText.wasted h1{color:#c81e1e}
#bigText.busted h1{color:#fff;text-shadow:0 4px 0 #1b3fa8,0 0 30px rgba(40,80,255,.8)}
#bigText.passed h1{color:var(--amber);font-size:min(84px,12vw)}
#bigText.failed h1{color:#e33;font-size:min(80px,12vw)}
#bigText.title h1{color:var(--cyan);font-size:min(70px,11vw);text-shadow:0 0 18px var(--pink),0 3px 0 #000}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7;transition:opacity .25s}
#switchOverlay{position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:7;display:flex;gap:24px;pointer-events:none;opacity:0;transition:opacity .3s}
#switchOverlay.show{opacity:1}
.swCard{width:130px;padding:14px;border-radius:14px;background:rgba(10,5,25,.75);text-align:center;border:3px solid rgba(255,255,255,.2);font-weight:800;font-size:20px}
.swCard .dot{width:60px;height:60px;border-radius:50%;margin:0 auto 8px;border:3px solid #fff}
.swCard.sel{border-color:var(--amber);box-shadow:0 0 20px rgba(255,176,58,.5)}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,rgba(255,45,149,.28),transparent 55%),radial-gradient(ellipse at 80% 90%,rgba(34,228,255,.22),transparent 60%),rgba(8,4,20,.72);overflow:auto;padding:16px}
.menuBox{width:min(880px,100%);max-height:100%;overflow:auto;background:rgba(12,6,30,.78);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:26px 30px;box-shadow:0 20px 60px rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.logo{text-align:center;line-height:.9}
.logo .l1{display:block;font-size:min(92px,18vw);font-family:Impact,"Arial Black",sans-serif;background:linear-gradient(180deg,#ffd0f0,#ff2d95 55%,#a3006a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,45,149,.6));letter-spacing:.05em}
.logo .l2{display:block;font-size:min(46px,10vw);font-family:Impact,"Arial Black",sans-serif;color:var(--cyan);letter-spacing:.32em;text-shadow:0 0 16px rgba(34,228,255,.8)}
.tag{text-align:center;color:#ffd7a0;margin:10px 0 18px;font-size:14px;letter-spacing:.1em}
.btnRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 16px}
button.big,button.mid{font-family:Impact,"Arial Black",sans-serif;letter-spacing:.08em;border:none;cursor:pointer;color:#fff;border-radius:40px;transition:transform .12s,box-shadow .12s}
button.big{font-size:28px;padding:12px 48px;background:linear-gradient(90deg,#ff2d95,#ff7a3c);box-shadow:0 6px 24px rgba(255,45,149,.5)}
button.mid{font-size:17px;padding:9px 22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
button.big:hover,button.mid:hover{transform:translateY(-2px) scale(1.03)}
button.mid:hover{background:rgba(34,228,255,.25)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px;margin:8px 0 18px;font-size:14px}
.opts label{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.06);padding:8px 12px;border-radius:10px}
.opts select,.opts input[type=range]{accent-color:var(--pink)}
.opts select{background:#1a1030;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:3px 6px}
.opts button{background:#1a1030;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:3px 12px;cursor:pointer;font-weight:700}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 18px;font-size:13px;color:#ddd}
.controls div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.1);padding:3px 0}
.controls div span:first-child{color:var(--amber);font-weight:700}
h3.sec{font-size:13px;letter-spacing:.2em;color:var(--cyan);margin:8px 0 8px;text-transform:uppercase}
.missionList{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.missionItem{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 16px;cursor:pointer;transition:background .15s}
.missionItem:hover{background:rgba(255,45,149,.22)}
.missionItem .num{font-family:Impact,sans-serif;font-size:34px;color:var(--amber);width:46px;text-align:center}
.missionItem h4{font-size:18px}
.missionItem p{font-size:13px;color:#ccc}
.missionItem .rew{margin-left:auto;color:#9cff9c;font-weight:800}
#diag{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:30;background:rgba(120,0,0,.85);padding:6px 12px;border-radius:8px;font-size:12px;max-width:80vw;display:none;font-family:monospace}
#fatal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#12040c;padding:20px}
#fatal .fbox{max-width:720px;background:#2a0a18;border:2px solid #ff2d95;border-radius:14px;padding:24px}
#fatal h2{color:#ff6ab0;margin-bottom:10px}
#fatal pre{white-space:pre-wrap;background:#000;padding:10px;border-radius:8px;font-size:12px;max-height:240px;overflow:auto;margin:10px 0}
#fatal p{font-size:14px;color:#ddd;margin-bottom:12px}
#fatal button{padding:8px 18px;border-radius:20px;border:none;background:#ff2d95;color:#fff;font-weight:700;cursor:pointer}
#loading{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#07040f;font-family:Impact,"Arial Black",sans-serif;letter-spacing:.1em;font-size:28px;color:var(--pink)}
#loading small{font-family:"Segoe UI",sans-serif;font-size:13px;color:#aaa;margin-top:10px;letter-spacing:0}
@media (max-width:700px){#radarWrap{width:150px}#minimap{width:150px;height:150px}#speedVal{font-size:40px}#objective{font-size:15px;bottom:180px;max-width:90vw}}
</style>
</head>
<body>
<div id="gameRoot"></div>

<div id="hud" class="hidden">
  <canvas id="compass" width="380" height="28"></canvas>
  <div id="envBox"><span id="clock">--:--</span> · <span id="weatherName">Klar</span> · <span id="zoneName"></span></div>
  <div id="topLeft"><div id="helpBox"></div></div>
  <div id="notify"></div>
  <div id="topRight">
    <div id="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
    <div id="money" class="tf">$0</div>
    <div id="weaponBox"><span id="weaponName">Pistole</span><span id="ammo">12 / 96</span><span id="reloadTag"></span></div>
    <div id="charBox"></div>
  </div>
  <div id="timerBox"></div>
  <div id="radarWrap">
    <canvas id="minimap" width="420" height="420"></canvas>
    <div id="bars"><div class="bar"><div id="hpFill"></div></div><div class="bar"><div id="armorFill"></div></div></div>
  </div>
  <div id="speedo" class="hidden">
    <div id="vehName"></div>
    <div id="speedVal">0</div><div class="unit">km/h</div>
    <div class="bar"><div id="vehHp"></div></div>
    <div class="bar"><div id="nitroFill"></div></div>
    <div id="radioName"></div>
  </div>
  <div id="objective"></div>
  <div id="crosshair" class="small"></div>
  <div id="hitmarker"></div>
  <div id="waypointInd" class="hidden"><div class="dia"></div><span></span></div>
  <div id="vignette"></div>
  <div id="policeEdge"></div>
  <div id="lockHint" class="hidden">Klicke ins Spielfeld, um die Maus zu fangen (oder mit gedrückter Maustaste ziehen)</div>
  <button id="muteBtn" title="Ton an/aus (N)">🔊</button>
</div>

<div id="bigText"><h1></h1><p></p></div>
<div id="switchOverlay"></div>
<div id="flash"></div>

<div id="menu" class="overlay hidden">
  <div class="menuBox">
    <div class="logo"><span class="l1">VICE LEGACY</span><span class="l2">3D</span></div>
    <div class="tag">SOLARA BAY · EIN TROPISCHES OPEN-WORLD-ABENTEUER · KAI &amp; ELENA</div>
    <div class="btnRow"><button class="big" id="btnPlay">▶ SPIELEN</button></div>
    <h3 class="sec">Optionen</h3>
    <div class="opts" id="optsMenu"></div>
    <h3 class="sec">Steuerung</h3>
    <div class="controls" id="controlsMenu"></div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="menuBox">
    <div class="logo"><span class="l2" style="letter-spacing:.2em">PAUSE</span></div>
    <div class="btnRow" style="margin-top:16px">
      <button class="big" id="btnResume">▶ WEITER</button>
    </div>
    <div class="btnRow">
      <button class="mid" id="btnTime">☀ Tageszeit +3h</button>
      <button class="mid" id="btnWeather">☁ Wetter wechseln</button>
      <button class="mid" id="btnMissions">★ Missionen</button>
      <button class="mid" id="btnMainMenu">⌂ Hauptmenü</button>
    </div>
    <h3 class="sec">Optionen</h3>
    <div class="opts" id="optsPause"></div>
    <h3 class="sec">Steuerung</h3>
    <div class="controls" id="controlsPause"></div>
  </div>
</div>

<div id="missionMenu" class="overlay hidden">
  <div class="menuBox">
    <div class="logo"><span class="l2" style="letter-spacing:.2em">MISSIONEN</span></div>
    <div class="missionList" id="missionList"></div>
    <div class="btnRow"><button class="mid" id="btnAbort">✖ Aktive Mission abbrechen</button><button class="mid" id="btnCloseMissions">Schließen (ESC)</button></div>
  </div>
</div>

<div id="diag"></div>
<div id="fatal"></div>
<div id="loading">VICE LEGACY 3D<small id="loadMsg">Lade Engine …</small></div>

<!-- Fehler-Grenze (klassisches Script: läuft auch, wenn das Modul scheitert) -->
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}
  window.__fatal=function(title,detail){
    if(window.__fatalShown) return; window.__fatalShown=true;
    var f=document.getElementById('fatal');
    f.innerHTML='<div class="fbox"><h2>⚠ '+esc(title)+'</h2><pre>'+esc(detail)+'</pre><p>Tipps: Aktuellen Browser (Chrome, Edge, Firefox, Safari) verwenden, Hardwarebeschleunigung aktivieren und die Internetverbindung zum Three.js-CDN (cdn.jsdelivr.net / unpkg.com) prüfen.</p><button onclick="location.reload()">Neu laden</button></div>';
    f.style.display='flex'; var l=document.getElementById('loading'); if(l) l.style.display='none';
  };
  window.__diag=function(msg){
    var d=document.getElementById('diag'); if(!d) return; d.style.display='block'; d.textContent='⚠ '+msg;
    clearTimeout(window.__diagT); window.__diagT=setTimeout(function(){d.style.display='none';},7000);
  };
  window.addEventListener('error',function(e){
    var m=(e.message||'Unbekannter Fehler')+(e.filename?' @ '+e.filename+':'+e.lineno:'');
    if(!window.__booted) window.__fatal('Startfehler',m); else window.__diag(m);
  });
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason; var m=r&&(r.stack||r.message)||String(r);
    if(!window.__booted) window.__fatal('Startfehler',m); else window.__diag(m);
  });
  try{ var c=document.createElement('canvas'); var gl=c.getContext('webgl2')||c.getContext('webgl')||c.getContext('experimental-webgl'); if(!gl) throw new Error('Kein WebGL-Kontext verfügbar.'); }
  catch(err){ window.__webglFail=String(err&&err.message||err); }
  setTimeout(function(){ if(!window.__booted) window.__fatal('Zeitüberschreitung beim Laden','Three.js oder die Spielwelt konnten nicht innerhalb von 30 s geladen werden.\nMögliche Ursache: keine Verbindung zum CDN oder sehr langsames Gerät.'); },30000);
})();
</script>

<script type="module">
// =====================================================================
//  VICE LEGACY 3D – Open-World-Action in einer Datei (Three.js + Web Audio)
// =====================================================================

// ---------- 1. ENGINE LADEN (mit Fallback-CDN & Diagnose) ----------
const $ = (id) => document.getElementById(id);
let THREE = null;
if (window.__webglFail) {
  window.__fatal('WebGL nicht verfügbar', window.__webglFail + '\n\nDein Browser oder Grafiktreiber stellt kein WebGL bereit. Aktiviere die Hardwarebeschleunigung oder nutze einen anderen Browser.');
  throw new Error('WebGL fehlt');
}
for (const url of ['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js', 'https://unpkg.com/three@0.160.0/build/three.module.js']) {
  try { THREE = await import(url); break; } catch (e) { console.warn('Three.js-Quelle fehlgeschlagen:', url, e); }
}
if (!THREE) { window.__fatal('Three.js konnte nicht geladen werden', 'Weder cdn.jsdelivr.net noch unpkg.com waren erreichbar.'); throw new Error('Three.js fehlt'); }
$('loadMsg').textContent = 'Baue Solara Bay …';
await new Promise(r => setTimeout(r, 30)); // Ladebildschirm zeichnen lassen

// ---------- 2. KONFIGURATION & KONSTANTEN ----------
const CFG = {
  ROADS_X: [-480, -400, -320, -240, -160, -80, 0, 80, 160, 240, 300],          // Nord-Süd-Straßen (x = konst.)
  ROADS_Z: [-480, -400, -320, -240, -160, -80, 0, 80, 160, 240, 320, 400, 480], // Ost-West-Straßen (z = konst.)
  ROAD_HW: 7, LANE: 3.5, SIDEWALK: 9.2,
  LAND: 600, BEACH_X0: 318, SHALLOW_X: 392, WATER_Y: -0.35, SEA_BOUND: 950,
  GRAVITY: 18,
  DAY_LENGTH: 720,      // Sekunden Echtzeit pro 24 Spielstunden
  START_TIME: 17.4,     // Start in der goldenen Stunde
  QUALITY: {
    low:    { label: 'Niedrig', pixelRatio: 0.75, shadows: false, shadowSize: 512,  peds: 12, traffic: 8,  particles: 700,  rain: 700,  lights: 2, far: 330 },
    medium: { label: 'Mittel',  pixelRatio: 1.0,  shadows: true,  shadowSize: 1024, peds: 22, traffic: 14, particles: 1400, rain: 1600, lights: 4, far: 480 },
    high:   { label: 'Hoch',    pixelRatio: Math.min(window.devicePixelRatio || 1, 2), shadows: true, shadowSize: 2048, peds: 32, traffic: 20, particles: 2200, rain: 2800, lights: 6, far: 650 },
  },
  WEATHER: [
    { id: 'clear', name: 'Klar',        rain: 0,    fog: 0,    dark: 0,    wet: 0,   wind: 0.6 },
    { id: 'rain',  name: 'Tropenregen', rain: 0.6,  fog: 0.35, dark: 0.45, wet: 1,   wind: 1.2 },
    { id: 'fog',   name: 'Dunst',       rain: 0,    fog: 0.85, dark: 0.2,  wet: 0.2, wind: 0.3 },
    { id: 'storm', name: 'Sturm',       rain: 1,    fog: 0.5,  dark: 0.65, wet: 1,   wind: 2.4, lightning: true },
  ],

      Audio.setStation(1);

  },
  pause() { if (!GS.playing) return; this.pausedFrom = GS.state; GS.set(STATES.PAUSED); this.pausedAt = performance.now(); $('pause').classList.remove('hidden'); UI.syncOptions(); In.unlock(); Audio.setHorn(false); },
  resume() { $('pause').classList.add('hidden'); $('missionMenu').classList.add('hidden'); if (GS.state !== STATES.PAUSED) return; GS.set(Missions.active ? STATES.MISSION_ACTIVE : STATES.PLAYING); In.lock(); },
  openMissions() { if (GS.playing) { this.pausedFrom = GS.state; GS.set(STATES.PAUSED); this.pausedAt = performance.now(); } else if (GS.state !== STATES.PAUSED) return; $('pause').classList.add('hidden'); UI.buildMissionList(); $('missionMenu').classList.remove('hidden'); In.unlock(); },
  mainMenu() { $('pause').classList.add('hidden'); $('missionMenu').classList.add('hidden'); $('hud').classList.add('hidden'); GS.set(STATES.MENU); $('menu').classList.remove('hidden'); UI.syncOptions(); },
  toggleSound() { Settings.sound = !Settings.sound; saveSettings(); Audio.init(); Audio.applyVolume(); UI.syncOptions(); UI.notify(Settings.sound ? '🔊 Ton an' : '🔇 Ton aus'); },
  applyQuality() {

    renderer.shadowMap.enabled = q.shadows; Env.sun.castShadow = q.shadows;
    if (Env.sun.shadow.map) { Env.sun.shadow.map.dispose(); Env.sun.shadow.map = null; } Env.sun.shadow.mapSize.set(q.shadowSize, q.shadowSize);

    if (GS.state !== STATES.MENU) {
      if (In.hit('Escape') || In.hit('KeyP')) {
        if (GS.playing) this.pause();
        else if (GS.state === STATES.PAUSED && performance.now() - this.pausedAt > 250) this.resume();
      }
      if (In.hit('KeyN')) this.toggleSound();
      if (In.hit('KeyM')) { if (GS.playing) this.openMissions(); else if (!$('missionMenu').classList.contains('hidden')) this.resume(); }
      if (GS.playing && !GS.switching) { if (In.hit('Tab')) Cam.startSwitch(); if (In.hit('KeyT')) Env.nextTime(); if (In.hit('KeyG')) Env.nextWeather(); }
    }
    if (GS.state === STATES.WASTED || GS.state === STATES.BUSTED) { this.overT -= realDt; if (this.overT <= 0) this.respawn(); }
    const menu = GS.state === STATES.MENU, paused = GS.state === STATES.PAUSED;
    const focus = menu ? tmpFocus.set(40, 0, -100) : Player.targetPos();
    if (!paused) {
      Player.update(dt);
      VS.update(dt, focus);
      NPCS.update(dt, focus);
      if (GS.playing) { Wanted.update(dt); Missions.update(dt); }
      Pickups.update(dt);
      FX.update(dt);
      Env.update(dt, focus);
      FX.pool.update(dt, focus, Env.night);
      if (menu) { const a = GameTime * 0.04; camera.position.set(40 + Math.cos(a) * 240, 95, -100 + Math.sin(a) * 240); camera.lookAt(40, 15, -100); Cam.setFov(60); }
      else Cam.update(realDt);
    }
    // Scheinwerfer des Spielerfahrzeugs
    const pv = Player.vehicle;
    if (pv && !pv.dead && Env.night > 0.3 && !menu) { const s = Math.sin(pv.yaw), c = Math.cos(pv.yaw); FX.head.position.set(pv.pos.x + s * pv.halfL, pv.pos.y + 0.9, pv.pos.z + c * pv.halfL); FX.head.target.position.set(pv.pos.x + s * 25, pv.pos.y - 1, pv.pos.z + c * 25); FX.head.intensity = 120 * Env.night; }
    else FX.head.intensity = 0;
    // Audio
    if (Audio.ready) {
      const live = !menu && !paused;
      if (pv && live) { const sp = Math.abs(pv.vF) / pv.spec.maxSpeed; const gear = pv.boat ? sp : ((sp * 5) % 1) * 0.65 + sp * 0.35; Audio.updateEngine(!pv.dead, clamp(gear, 0, 1.2), pv.input.throttle || 0, pv.boat ? 'boat' : pv.isBike ? 'bike' : pv.type); }
      else Audio.updateEngine(false, 0, 0, 'car');
      let sv = 0; if (live) for (const v of VS.list) if (v.sirenOn && !v.dead) { const d = camera.position.distanceTo(v.pos); sv = Math.max(sv, v === pv ? 0.6 : 1 / (1 + d * 0.035)); }
      Audio.updateSiren(sv, GameTime);
      Audio.updateAmbient(GameTime, { wind: Env.w.wind * (live ? 1 : 0.5), waves: clamp(1 - Math.abs(focus.x - 380) / 110, 0, 1), rain: Env.w.rain, city: live ? 0.6 : 0.3 });
      Audio.updateRadio(!!pv && live);
    }
    if (GS.state !== STATES.MENU) UI.update(realDt);
  },
};
const tmpFocus = V3();
function frame(now) {
  requestAnimationFrame(frame);
  const realDt = Math.min(0.05, Math.max(0, (now - (frame.last || now)) / 1000)); frame.last = now;
  try { Game.update(realDt); renderer.render(scene, camera); }
  catch (e) { Game.errors++; if (Game.errors < 6) console.error(e); window.__diag('Laufzeitfehler: ' + (e && e.message)); }
  In.endFrame();
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
bus.on('gunshot', ({ pos, byPlayer }) => { NPCS.panicAround(pos, 40, pos); VS.panicAround(pos, 40); for (const n of NPCS.list) if (n.kind === 'gang' && n.alive && n.pos.distanceTo(pos) < 60) n.alerted = true; if (byPlayer) Wanted.crime('shots', pos); });
bus.on('lock', (locked) => { if (!locked && GS.playing && !In.lockFailed && performance.now() - (Game.lockAt || 0) > 300) Game.pause(); if (locked) Game.lockAt = performance.now(); });

// ---------- 23. START ----------
let Env, VS, NPCS;
try {
  buildWorld();
  Env = new Environment();
  FX.init();
  VS = new VehicleSystem(); NPCS = new NPCSystem();
  Player.init(); Pickups.init(); Missions.init(); UI.init();
  VS.spawnParked();
  for (const ch of Player.chars) { ch.h.group.position.copy(ch.pos); ch.h.group.rotation.y = ch.yaw; }
  // Vorab einmal rendern (Shader kompilieren), dann Menü zeigen
  Env.update(0.016, tmpFocus.set(40, 0, -100)); renderer.compile(scene, camera);
} catch (e) { window.__fatal('Die Spielwelt konnte nicht aufgebaut werden', (e && (e.stack || e.message)) || String(e)); throw e; }
window.__booted = true;
$('loading').style.display = 'none'; $('menu').classList.remove('hidden');
requestAnimationFrame(frame);
window.__game = { GS, Player, VS, NPCS, Wanted, Missions, Env, Cam, Game, In, Audio, World, STATES, renderer, scene, camera };
</script>
